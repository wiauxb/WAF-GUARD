services:

  neo4j_na:
    container_name: neo4j_na
    image: neo4j:latest
    volumes:
      # The neo4j image declares `VOLUME /data /logs`. Any of those left unmounted gets a
      # fresh ANONYMOUS volume every time the container is created, so a `down` + `up`
      # silently starts from empty and leaves the old one dangling. Both are named here.
      # Note /data — the old commented-out line pointed at /neo4j/, which is not where
      # neo4j stores anything.
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: wget -O /dev/null "http://localhost:7474/" || exit 1
      interval: 5s
      timeout: 2s
      retries: 10
      start_period: 30s

  postgres_na:
    container_name: postgres_na
    # Pinned: the postgres_data mount below is correct for 18's layout
    # (PGDATA=/var/lib/postgresql/18/docker under VOLUME /var/lib/postgresql).
    # Postgres never auto-upgrades PGDATA across majors, so a floating `latest`
    # would one day start against a data dir it cannot read.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    
  adminer_na:
    container_name: adminer_na
    image: adminer
    ports:
      - 8080:8080
    depends_on:
      postgres_na:
        condition: service_healthy
        restart: true


  backend_na:
    container_name: backend_na
    build: ./backend
    volumes:
      - ./backend/src:/app
    environment:
      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - WAF_URL=${WAF_URL}
      - DELETE_BATCH_SIZE=${DELETE_BATCH_SIZE}
      - POSTGRES_DB_CWAF=${POSTGRES_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    ports:
      - "8000:8000"
    command: "fastapi dev main.py --host 0.0.0.0 --port 8000"
    depends_on:
      postgres_na:
        condition: service_healthy
        restart: true
      neo4j_na:
        condition: service_healthy
        restart: true
      waf_na:
        condition: service_started
        restart: true
    
  react_na:
    container_name: react_na
    build: ./frontend
    volumes:
      - ./frontend/waf-react:/app/waf-react
    ports:
      - "8002:8002"
    working_dir: /app/waf-react
    command: "npm run dev"
    depends_on:
      backend_na:
        condition: service_started
        restart: true

  waf_na:
    container_name: waf_na
    build: ./waf
    privileged: true
    volumes:
      - ./waf/src:/opt/api
    ports:
      - "9090:8000"
    working_dir: /opt/api
    command: "fastapi dev main.py --host 0.0.0.0 --port 8000"

  # Log classifier. Reached at http://model_na:8102 — hardcoded in services/logs/service.py.
  model_na:
    image: nelver28/modernbert:latest
    container_name: model_na
    ports:
      - "8102:8102"
    restart: always

volumes:
  neo4j_data:      # graph — must stay named, see the neo4j_na comment
  neo4j_logs:      # neo4j's other declared VOLUME; named so it stops spawning anonymous ones
  postgres_data:   # matches the image's VOLUME /var/lib/postgresql exactly

